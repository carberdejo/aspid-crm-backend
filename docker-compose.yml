version: "3.8"

services:
  aspid-backend:
    image: aspid-backend:v1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aspid-backend-api
    restart: always
    ports:
      - "${PORT}:${PORT}"
    # Cargamos las variables de entorno (DB_HOST, DB_USER, etc.) desde tu .env
    env_file:
      - .env
    networks:
      - aspid_network

networks:
  # Definimos la red personalizada
  aspid_network:
    external: true
    name: red_global_aspid
